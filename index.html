<!DOCTYPE html> 
<html lang="en"> 
<head> 
<meta charset="UTF-8"> 
<meta name="viewport" content="width=device-width, initial-scale=1.0"> 
<title>Сложный пример CSS Grid</title> 
<style> 

  body { 
    display: flex; 
    align-items: center; 
    justify-content: center; 
    min-height: 100vh; 
    margin: 0; 
    font-family: Arial, sans-serif; 
    background-color: #f5f5f5; 
  } 
 
  /* Контейнер сетки */ 
  .grid-container { 
    display: grid; 
    grid-template-columns: 2fr 2fr 1fr; 
    grid-template-rows:2fr 2fr 4fr 1fr;   
    width: 90%; 
    max-width: 1200px; 
    padding: 13px;
    gap: 10px;
    background-color: rgba(128, 128, 128, 0.17);
  } 
 
  /* Цветные элементы сетки с именованными областями */ 
  .item1 {  background-color: #FF6B6B; } 
  .item2 {  background-color: #FFD93D; } 
  .item3 {  background-color: #6BCB77; } 
  .item4 { 
     grid-column: 3;
     grid-row: 4;
    background-color: #4D96FF;
    min-height: 0;
 } 
    
  .item5 { max-width: 60% ; 
        grid-row: 3;
        background-color: #FFB6B9; } 
  .item6 {  background-color: #A1E8AF; } 
  .item7 {  background-color: #FFE156; } 
  .item8 { grid-column: 1/3;
     background-color: #FF9F1C; } 
   

 
  /* Оформление элементов сетки */ 
  .grid-item { 
    display: flex; 
    align-items: center; 
    justify-content: center; 
    color: white; 
    font-size: 1.5em; 
    font-weight: bold; 
    border-radius: 8px; 
    padding: 20px; 
  } 
</style> 
</head> 
<body> 
 
<div class="grid-container"> 
  <div class="grid-item item6">Широкий блок</div> 
  <div class="grid-item item7">Во всю ширину</div> 
  <div class="grid-item item8">Нижний блок</div> 
  <div class="grid-item item5">Большой блок</div> 
  <div class="grid-item item4">Футер</div> 
</div> 
</body> 
</html>
